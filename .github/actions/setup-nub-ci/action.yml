name: Set up Nub (CI)
description: >
  Install Nub and Node from the committed `.node-version` pin. Pass
  node-version only for a matrix job that must run a different major
  (writes that version into `.node-version` so `nub run` uses it;
  those jobs do not commit).
inputs:
  node-version:
    description: Optional major override (e.g. 26). Omit to use `.node-version`.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Override Node pin for this job
      if: ${{ inputs.node-version != '' }}
      shell: bash
      run: echo "${{ inputs.node-version }}" > .node-version
    - name: Set up Nub (project pin)
      if: ${{ inputs.node-version == '' }}
      uses: nubjs/setup-nub@v0
      with:
        shim: true
        node-version-file: .node-version
    - name: Set up Nub (job override)
      if: ${{ inputs.node-version != '' }}
      uses: nubjs/setup-nub@v0
      with:
        shim: true
        node-version: ${{ inputs.node-version }}
