name: "size-limit"
on:
  pull_request:
    branches:
      - dev
    paths:
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  changes:
    if: github.repository == 'yamcodes/arkenv'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'

  size-limit:
    if: github.repository == 'yamcodes/arkenv' && (needs.changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch')
    needs: changes
    runs-on: ubuntu-latest
    env:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        if: env.APP_PRIVATE_KEY != ''
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history needed for change detection
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run size-limit checks
        uses: ./.github/actions/size-limit
        with:
          github_token: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          filter: "./packages/*"
