name: release

on:
  push:
    branches:
      - dev
      - v1
  workflow_dispatch:
    inputs:
      promote_rc_to_latest:
        description: >
          Point npm latest at current @rc versions (no publish). Requires the
          NPM_TOKEN secret. Only while Changesets pre tag is rc.
        type: boolean
        default: false
      mark_github_pre_as_latest:
        description: >
          Mark current workspace SemVer-prerelease GitHub Releases as Latest
          (clears GitHub prerelease flag; make_latest on arkenv). Only while
          Changesets pre mode is active. Must run on the v1 branch. Does not
          change npm dist-tags.
        type: boolean
        default: false

permissions:
  id-token: write # Required for OIDC (npm publish only — not dist-tag)
  contents: read

jobs:
  release:
    name: Release
    # Skip release for autofix-ci[bot] pushes to preserve "publish exactly once".
    # Paired with autofix.yml's Version Packages skip: that guard stops autofix
    # from cancelling an in-flight release; this guard stops a re-triggered
    # release on an autofix fixup from double-publishing. Removing either
    # guard reopens a race (stranding or double-publish).
    # See docs/adr/0006-branching-and-release-flow.md.
    if: github.event_name == 'push' && github.event.sender.login != 'autofix-ci[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Set up Nub
        # Pin is `.node-version` (24.21.0; changesets needs >=24.18.0).
        # see: https://github.com/changesets/changesets/issues/2123#issuecomment-4814124084
        uses: ./.github/actions/setup-nub-ci

      - name: Install Dependencies
        run: nub install

      # changesets/action runs `changeset version` directly (not via
      # package.json scripts). Materialize the gitignored packages-only
      # pnpm-workspace.yaml from package.json workspaces.packages so
      # @manypkg can discover packages under Nub identity. Publish itself
      # does not use pnpm — scripts/changeset-publish.js rewrites
      # workspace:/catalog: then runs changeset publish via npm.
      - name: Materialize Changesets workspace shim
        run: node scripts/ensure-manypkg-workspace.js

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          publish-script: nub run --no-check release
          github-token: ${{ steps.generate-token.outputs.token }}

      # Product RC path: also point npm `latest` at the just-published
      # versions so bare `npx arkenv` resolves to RC. Changesets pre mode
      # only updates the `rc` dist-tag. Publish stays on OIDC; the npm CLI
      # has no OIDC exchange for `dist-tag`, so secrets.NPM_TOKEN (granular
      # stage-only token — dist-tag, not publish) is the supported path.
      # Prefer "Read and write (stage only)", bypass 2FA, @arkenv + arkenv
      # only, no org write; rotate ~90 days. Missing token skips soft
      # (warns) so publish itself is not failed. Gate: .changeset/pre.json
      # mode === "pre" && tag === "rc". `changeset pre exit` sets mode to
      # "exit" (file deleted later by `changeset version`) and stops this.
      # Uses resolveSystemNpmInvocation so Nub PATH shims cannot block
      # `npm dist-tag`. See docs/RC_CHECKLIST.md §C and
      # scripts/point-latest-at-rc.js.
      - name: Point latest at published RC
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >
          node scripts/point-latest-at-rc.js
          --packages '${{ steps.changesets.outputs.published-packages }}'

      # Recovery when a prior publish left `latest` unfinished (e.g. Nub
      # shim blocked dist-tag on the publish run). Idempotent; soft-skips
      # when pre.json is not mode=pre tag=rc.
      - name: Point latest at current @rc
        if: >
          steps.changesets.outputs.published != 'true' &&
          github.ref_name == 'v1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/point-latest-at-rc.js --from-rc

      # Product RC path: GitHub Releases UI should show the current RC as
      # Latest. changesets/action creates releases with
      # prerelease: version.includes("-") and does not set make_latest.
      # GitHub forbids Latest on prereleases, so we PATCH each published
      # SemVer-prerelease release to prerelease=false and set
      # make_latest=true on arkenv (else @arkenv/core; if neither is in
      # the publish set, clear prerelease only — do not move Latest). Gate:
      # .changeset/pre.json mode === "pre"; v1 only so a future `dev`
      # alpha publish cannot steal Latest from the RC line. Does not
      # touch npm dist-tags. See scripts/mark-github-releases-latest.js.
      # Runs even if the dist-tag step failed so a shim/token issue does
      # not leave Releases stuck as Pre-release.
      - name: Mark GitHub prereleases as Latest
        if: >
          !cancelled() &&
          (success() || failure()) &&
          steps.changesets.outputs.published == 'true' &&
          github.ref_name == 'v1'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >
          node scripts/mark-github-releases-latest.js
          --packages '${{ steps.changesets.outputs.published-packages }}'

      # Same recovery path as Point latest at current @rc: finish Latest
      # after a prior publish when this push did not publish again.
      - name: Mark workspace GitHub prereleases as Latest
        if: >
          !cancelled() &&
          (success() || failure()) &&
          steps.changesets.outputs.published != 'true' &&
          github.ref_name == 'v1'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/mark-github-releases-latest.js --from-workspace

      - name: Sync main branch
        if: steps.changesets.outputs.published == 'true' && github.ref_name == 'dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge dev --ff-only
          git push origin main

  # One-shot: promote current @rc → latest without waiting for the next
  # publish (e.g. after adding NPM_TOKEN, or if a publish retag was skipped).
  promote-rc-latest:
    name: Promote @rc → latest
    if: github.event_name == 'workflow_dispatch' && inputs.promote_rc_to_latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Point latest at current @rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/point-latest-at-rc.js --from-rc

  # One-shot: clear GitHub Pre-release + set Latest on workspace pre tags
  # (e.g. after landing this automation, or if a publish step was skipped).
  mark-github-pre-latest:
    name: Mark GitHub pre as Latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.mark_github_pre_as_latest &&
      github.ref_name == 'v1'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Mark workspace prerelease GitHub Releases as Latest
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/mark-github-releases-latest.js --from-workspace
