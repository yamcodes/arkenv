name: "pkg.pr.new"
on:
  pull_request:
    branches:
      - dev
      - v1
    paths:
      - "packages/**"
  push:
    branches:
      - dev
      - v1
    paths:
      - "packages/**"
      - ".github/workflows/pkg-pr-new.yml"
    tags:
      - "!**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  pkg-pr-new:
    if: github.repository == 'yamcodes/arkenv'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Set up Nub
        uses: ./.github/actions/setup-nub-ci

      - name: Install deps
        run: pnpm install

      - name: Build
        run: nub run --no-check build --filter="./packages/*"
        env:
          TURBO_FORCE: "true"

      - name: Release
        # -y: pkg-pr-new is not a workspace dep; nubx refuses undownloaded tools in CI.
        # --node: pkg-pr-new ships a broken tsconfig; skip Nub's TS project load.
        run: nubx --node -y pkg-pr-new publish --compact --pnpm './packages/*'
