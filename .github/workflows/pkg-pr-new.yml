name: "pkg.pr.new"
on:
  pull_request:
    branches:
      - dev
      - v1
    paths:
      - "packages/**"
  push:
    branches:
      - dev
      - v1
    paths:
      - "packages/**"
      - ".github/workflows/pkg-pr-new.yml"
    tags:
      - "!**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  pkg-pr-new:
    if: github.repository == 'yamcodes/arkenv'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          shim: true
          node-version: 24

      - name: Install deps
        run: nub install

      - name: Build
        run: nub run build --filter="./packages/*"
        env:
          TURBO_FORCE: "true"

      - name: Release
        run: nubx pkg-pr-new publish --compact --pnpm './packages/*'
