name: sync-examples

on:
  pull_request:
    paths:
      - "apps/playgrounds/**"
      - "examples/**"
      - "package.json"
      - "scripts/sync-examples.js"
      - "scripts/sync-lib/**"
  push:
    branches: ["dev", "v1"]
    paths:
      - "apps/playgrounds/**"
      - "examples/**"
      - "package.json"
      - "scripts/sync-examples.js"
      - "scripts/sync-lib/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  check-sync:
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Nub
        uses: ./.github/actions/setup-nub-ci

      - name: Install dependencies
        run: nub install

      - name: Build packages
        run: nub run --no-check build:packages

      - name: Check examples sync
        run: nub run --no-check sync:examples:check

  auto-sync:
    if: github.actor == 'renovate[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ github.head_ref }}

      - uses: ./.github/actions/setup-nub-ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: nub install
      - run: nub run --no-check build:packages
      - run: nub run --no-check sync:examples

      - name: Commit example updates
        run: |
          git config --global user.email "237618717+arkenv-bot[bot]@users.noreply.github.com"
          git config --global user.name "arkenv-bot[bot]"
          if [ -n "$(git status --porcelain examples .github/renovate.json)" ]; then
            git add examples .github/renovate.json
            git commit -m "chore(examples): sync generated examples"
            git push origin HEAD || {
              echo "❌ Failed to push example sync changes. Please re-run the workflow."
              exit 1
            }
          else
            echo "✓ No changes in examples to sync"
          fi
