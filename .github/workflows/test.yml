name: test

on:
  pull_request:
    branches: [dev, v1]
  push:
    branches: [dev, v1]
  schedule:
    - cron: "0 0 * * 6" # Every Saturday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Concrete majors only — setup-nub does not front lts/* / latest aliases.
      matrix:
        node-version: [24, 26]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: nub install
      - name: Build packages
        run: nub run --no-check build --filter=./packages/*
      - run: nub run --no-check test
      - name: Verify build artifacts
        run: nub run --no-check verify-artifacts
      - name: Run E2E package tests
        run: nub run --no-check test:e2e:package

  test-typesafety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: 24
      - run: nub install
      - run: nub run --no-check typecheck

  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: nub install
      - run: nub run --no-check build

  test-vite-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vite-version: ["4", "5", "6", "7", "8"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: 24
      - run: nub install
      - name: Build workspace packages
        run: nub run --no-check build:packages
      - name: Apply overrides for Vite version
        run: node scripts/override-vite.js ${{ matrix.vite-version }}
      - name: Reinstall dependencies with overrides
        run: nub install --no-frozen-lockfile
      - name: Build vite-legacy playground
        run: nub run --no-check build --filter=vite-legacy-playground

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      matrix:
        suite: [e2e]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Set Turbo base/head for PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha || github.event.before }}" >> $GITHUB_ENV
          echo "TURBO_SCM_HEAD=${{ github.sha }}" >> $GITHUB_ENV
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: 24
      - run: nub install
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-latest-pw-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-latest-pw-
      - name: Install Playwright browsers
        # Chromium + Firefox only — matches playwright-www projects on Linux (webkit is macOS-only)
        run: nubx playwright install --with-deps chromium firefox
      - name: Build www and dependencies
        run: nub run --no-check build --filter=www...
      - name: Run ${{ matrix.suite }} tests (PR)
        if: ${{ github.event_name == 'pull_request' }}
        run: nub run --no-check test:${{ matrix.suite }} --affected --log-order=stream
      - name: Run ${{ matrix.suite }} tests (dev/workflow_dispatch)
        if: ${{ github.event_name != 'pull_request' }}
        run: nub run --no-check test:${{ matrix.suite }} --log-order=stream --filter="@repo/playwright-*"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.suite }}
          path: "**/test-results/**"
          retention-days: 30
  test-windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(join(github.event.pull_request.labels.*.name, ','), 'windows')
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [24, 26]
    continue-on-error: ${{ matrix.node-version == 26 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # for checking against dev and for following the PR history
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Set Turbo base/head for PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha || github.event.before }}" >> $GITHUB_ENV
          echo "TURBO_SCM_HEAD=${{ github.sha }}" >> $GITHUB_ENV
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: nub install
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: windows-latest-pw-${{ hashFiles('pnpm-lock.yaml') }}-${{ matrix.node-version }}
          restore-keys: |
            windows-latest-pw-${{ hashFiles('pnpm-lock.yaml') }}-
            windows-latest-pw-
      - name: Install Playwright browsers
        run: nubx playwright install --with-deps
      - run: nub run --no-check build
      - run: nub run --no-check test
      - run: nub run --no-check test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-windows-${{ matrix.node-version }}
          path: "**/test-results/**"
          retention-days: 30

  test-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(join(github.event.pull_request.labels.*.name, ','), 'macos')
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [24, 26]
    continue-on-error: ${{ matrix.node-version == 26 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # for checking against dev and for following the PR history
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Set Turbo base/head for PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha || github.event.before }}" >> $GITHUB_ENV
          echo "TURBO_SCM_HEAD=${{ github.sha }}" >> $GITHUB_ENV
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: nub install
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: macos-latest-pw-${{ hashFiles('pnpm-lock.yaml') }}-${{ matrix.node-version }}
          restore-keys: |
            macos-latest-pw-${{ hashFiles('pnpm-lock.yaml') }}-
            macos-latest-pw-
      - name: Install Playwright browsers
        run: nubx playwright install --with-deps
      - run: nub run --no-check build
      - run: nub run --no-check test
      - run: nub run --no-check test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-macos-${{ matrix.node-version }}
          path: "**/test-results/**"
          retention-days: 30
