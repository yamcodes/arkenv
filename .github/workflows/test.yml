name: test

on:
  pull_request:
    branches: [dev, v1]
  push:
    branches: [dev, v1]
  schedule:
    - cron: "0 0 * * 6" # Every Saturday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: write
jobs:
  test:
    # Channel labels stay `lts` / `latest` so required-check names stay
    # fixed. `lts` reads `.node-version`; `latest` overrides to 26.
    name: test (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - channel: lts
          - channel: latest
            node-version: "26"
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: nub install
      - name: Build packages
        run: nub run --no-check build --filter=./packages/*
      - run: nub run --no-check test
      - name: Verify build artifacts
        run: nub run --no-check verify-artifacts
      - name: Run E2E package tests
        run: nub run --no-check test:e2e:package

  test-typesafety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup-nub-ci
      - run: nub install
      - run: nub run --no-check typecheck

  test-build:
    name: test-build (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - channel: lts
          - channel: latest
            node-version: "26"
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: nub install
      # --node: outer nub run skips TS preload. Nested turbo children are still
      # `nub run` under packageManager=nub; nuxt-playground keeps a stub
      # `.nuxt/tsconfig.json` so that nested run can start before `nuxt prepare`.
      - run: nub run --no-check --node build

  test-vite-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vite-version: ["4", "5", "6", "7", "8"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup-nub-ci
      - run: nub install
      - name: Build workspace packages
        run: nub run --no-check build:packages
      - name: Apply overrides for Vite version
        run: node scripts/override-vite.js ${{ matrix.vite-version }}
      - name: Reinstall dependencies with overrides
        run: nub install --no-frozen-lockfile
      - name: Build vite-legacy playground
        run: nub run --no-check --node build --filter=vite-legacy-playground

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      matrix:
        suite: [e2e]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Set Turbo base/head for PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha || github.event.before }}" >> $GITHUB_ENV
          echo "TURBO_SCM_HEAD=${{ github.sha }}" >> $GITHUB_ENV
      - uses: ./.github/actions/setup-nub-ci
      - run: nub install
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-latest-pw-${{ hashFiles('nub.lock') }}
          restore-keys: |
            ubuntu-latest-pw-
      - name: Install Playwright browsers
        # Chromium + Firefox only — matches playwright-www projects on Linux (webkit is macOS-only)
        run: nubx playwright install --with-deps chromium firefox
      - name: Build www and dependencies
        run: nub run --no-check build --filter=www...
      - name: Run ${{ matrix.suite }} tests (PR)
        if: ${{ github.event_name == 'pull_request' }}
        run: nub run --no-check test:${{ matrix.suite }} --affected --log-order=stream
      - name: Run ${{ matrix.suite }} tests (dev/workflow_dispatch)
        if: ${{ github.event_name != 'pull_request' }}
        run: nub run --no-check test:${{ matrix.suite }} --log-order=stream --filter="@repo/playwright-*"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.suite }}
          path: "**/test-results/**"
          retention-days: 30
  test-windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(join(github.event.pull_request.labels.*.name, ','), 'windows')
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - channel: pin
          - channel: latest
            node-version: "26"
    continue-on-error: ${{ matrix.node-version == '26' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # for checking against dev and for following the PR history
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Set Turbo base/head for PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha || github.event.before }}" >> $GITHUB_ENV
          echo "TURBO_SCM_HEAD=${{ github.sha }}" >> $GITHUB_ENV
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: nub install
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: windows-latest-pw-${{ hashFiles('nub.lock') }}-${{ matrix.channel }}
          restore-keys: |
            windows-latest-pw-${{ hashFiles('nub.lock') }}-
            windows-latest-pw-
      - name: Install Playwright browsers
        run: nubx playwright install --with-deps
      - run: nub run --no-check --node build
      - run: nub run --no-check test
      - run: nub run --no-check test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-windows-${{ matrix.channel }}
          path: "**/test-results/**"
          retention-days: 30

  test-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(join(github.event.pull_request.labels.*.name, ','), 'macos')
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - channel: pin
          - channel: latest
            node-version: "26"
    continue-on-error: ${{ matrix.node-version == '26' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # for checking against dev and for following the PR history
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Set Turbo base/head for PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha || github.event.before }}" >> $GITHUB_ENV
          echo "TURBO_SCM_HEAD=${{ github.sha }}" >> $GITHUB_ENV
      - uses: ./.github/actions/setup-nub-ci
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: nub install
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: macos-latest-pw-${{ hashFiles('nub.lock') }}-${{ matrix.channel }}
          restore-keys: |
            macos-latest-pw-${{ hashFiles('nub.lock') }}-
            macos-latest-pw-
      - name: Install Playwright browsers
        run: nubx playwright install --with-deps
      - run: nub run --no-check --node build
      - run: nub run --no-check test
      - run: nub run --no-check test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-macos-${{ matrix.channel }}
          path: "**/test-results/**"
          retention-days: 30
