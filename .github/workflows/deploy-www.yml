name: Deploy www
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      # RC cutover (Option A): v1 owns Production / arkenv.js.org.
      # main parks the v0 docs line on arkenv-v0.vercel.app (not --prod).
      - v1
      - main
    paths:
      - "apps/www/**"
      - "packages/arkenv/**"
      - "packages/nextjs/**"
      - "packages/vite-plugin/**"
      - "packages/bun-plugin/**"
      - "packages/fumadocs-ui/**"
      - "packages/internal/**"
      - ".github/workflows/deploy-www.yml"
      - "scripts/vercel-wrapper.cjs"
      - "nub.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so blog post dates resolve from first-add commits
          # (shallow checkouts invent a fake "add" at the boundary commit).
          fetch-depth: 0
      - name: Set up Turborepo Remote Cache
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup-nub-ci
      - name: Install dependencies
        run: nub install
      - name: Resolve deploy mode
        id: mode
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            v1)
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "prod=true" >> "$GITHUB_OUTPUT"
              echo "alias=arkenv-v1.vercel.app" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "environment=preview" >> "$GITHUB_OUTPUT"
              echo "prod=false" >> "$GITHUB_OUTPUT"
              echo "alias=arkenv-v0.vercel.app" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected branch: ${{ github.ref_name }}" >&2
              exit 1
              ;;
          esac
      - name: Pull Vercel Environment Information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ENVIRONMENT: ${{ steps.mode.outputs.environment }}
        run: node scripts/vercel-wrapper.cjs pull --yes --environment="$ENVIRONMENT" --token="$VERCEL_TOKEN"
      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD: ${{ steps.mode.outputs.prod }}
        run: |
          if [ "$PROD" = "true" ]; then
            node scripts/vercel-wrapper.cjs build --prod --token="$VERCEL_TOKEN"
          else
            node scripts/vercel-wrapper.cjs build --token="$VERCEL_TOKEN"
          fi
      - name: Deploy Project Artifacts to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD: ${{ steps.mode.outputs.prod }}
          ALIAS: ${{ steps.mode.outputs.alias }}
          GIT_ORG: ${{ github.repository_owner }}
          GIT_REPO: ${{ github.event.repository.name }}
          GIT_REF: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          GIT_ACTOR: ${{ github.actor }}
          GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
          GIT_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          set -o pipefail
          SHORT_MSG="${GIT_COMMIT_MESSAGE%%$'\n'*}"
          META_ARGS=(
            -m githubDeployment=1
            -m githubOrg="$GIT_ORG"
            -m githubRepo="$GIT_REPO"
            -m githubCommitOrg="$GIT_ORG"
            -m githubCommitRepo="$GIT_REPO"
            -m githubCommitRef="$GIT_REF"
            -m githubCommitSha="$GIT_SHA"
            -m githubCommitMessage="$SHORT_MSG"
            -m githubCommitAuthorName="$GIT_COMMIT_AUTHOR_NAME"
            -m githubCommitAuthorLogin="$GIT_ACTOR"
          )
          deploy_log="$(mktemp)"
          trap 'rm -f "$deploy_log"' EXIT
          if [ "$PROD" = "true" ]; then
            # --prod assigns Production domains (arkenv.js.org / arkenv.vercel.app).
            # Also keep arkenv-v1.vercel.app pointed at the same deployment.
            node scripts/vercel-wrapper.cjs deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN" \
              "${META_ARGS[@]}" | tee "$deploy_log"
            DEPLOYMENT_URL="$(tail -n 1 "$deploy_log")"
            echo "Deployed $GIT_SHA to production (arkenv.js.org)."
            echo "Aliasing $DEPLOYMENT_URL -> $ALIAS"
            node scripts/vercel-wrapper.cjs alias set "$DEPLOYMENT_URL" "$ALIAS" --token="$VERCEL_TOKEN"
          else
            # Legacy v0 line: preview deploy + stable archive alias (not --prod).
            node scripts/vercel-wrapper.cjs deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" \
              "${META_ARGS[@]}" | tee "$deploy_log"
            DEPLOYMENT_URL="$(tail -n 1 "$deploy_log")"
            echo "Deployment URL: $DEPLOYMENT_URL"
            echo "Aliasing $DEPLOYMENT_URL -> $ALIAS"
            node scripts/vercel-wrapper.cjs alias set "$DEPLOYMENT_URL" "$ALIAS" --token="$VERCEL_TOKEN"
          fi
