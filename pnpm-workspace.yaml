packages:
  - packages/*
  - packages/internal/*
  - apps/*
  - apps/playgrounds/*
publishBranch: dev
allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  '@vercel/speed-insights': true
  bun: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true

catalog:
  '@ark/attest': 0.56.3
  '@axe-core/playwright': 4.13.0
  '@size-limit/esbuild-why': 12.1.0
  '@size-limit/preset-small-lib': 12.1.0
  '@types/bun': 1.4.0
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@vitejs/plugin-react': 6.1.0
  '@vitest/coverage-v8': ^4.1.5
  '@vitest/ui': 4.1.11
  arktype: 2.2.3
  bun: 1.4.0
  esbuild: 0.28.2
  globals: 17.11.0
  jiti: 2.7.0
  next: 16.3.2
  react: 19.2.8
  react-dom: 19.2.8
  rimraf: 6.1.3
  size-limit: 12.1.0
  tsdown: 0.22.14
  tsx: 4.23.12
  typescript: 6.0.3
  valibot: 1.4.2
  vitest: 4.1.11
  zod: 4.4.3

overrides:
  '@playwright/test': 1.62.1
  import-in-the-middle: 2.0.6
  require-in-the-middle: 8.0.1
publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'
